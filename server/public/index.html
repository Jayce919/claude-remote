<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Remote</title>
<style>
  :root { --bg:#f9f9f7; --fg:#29261b; --muted:#898781; --line:#e1e0d9; --clay:#c6613f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1a1a19; --fg:#f5f4ef; --muted:#a2a4a6; --line:#33332f; } }
  * { box-sizing: border-box; }
  body {
    margin:0; padding:48px 20px; background:var(--bg); color:var(--fg);
    font: 16px/1.6 -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    max-width: 560px; margin-inline: auto;
  }
  h1 { font-size:22px; font-weight:600; margin:0 0 6px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 28px; }
  .note {
    border-left:2px solid var(--clay); padding:2px 0 2px 12px;
    color:var(--muted); font-size:14px; margin:0 0 28px;
  }
  h2 { font-size:13px; font-weight:600; color:var(--muted); letter-spacing:.04em;
       text-transform:uppercase; margin:0 0 10px; }
  ul { list-style:none; padding:0; margin:0; border-top:1px solid var(--line); }
  li { display:flex; justify-content:space-between; align-items:center;
       padding:11px 2px; border-bottom:1px solid var(--line); gap:12px; }
  a { color:var(--fg); text-decoration:none; font-size:14px; word-break:break-all; }
  a:active { color:var(--clay); }
  li span { color:var(--muted); font-size:12px; white-space:nowrap; }
  footer { margin-top:28px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
  <h1>Claude Remote</h1>
  <p class="sub">手机遥控本机 Claude Code</p>

  <p class="note">这个页面只在服务启动后用于确认服务可用。手机客户端请从这个项目的 Releases 下载，或按 README 自行构建。</p>

  <h2>安装包</h2>
  <ul>
      <li><span>把构建好的 APK 放进 <code>server/public/</code>，它会出现在这里</span></li>
  </ul>

  <footer>服务地址：https://<你的主机名>.<你的域名>.ts.net</footer>
</body>
</html>
